[package]
name = "luma-spike"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }

# Feature unification enables the opt-in on Tauri's existing Tao dependency.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-single-instance = "=2.4.4"
tao = { version = "=0.35.3", default-features = false, features = ["macos-no-activate-on-launch"] }

[patch.crates-io]
tao = { path = "vendor/tao" }
