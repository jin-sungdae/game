<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LUMA Local Controller</title><link rel="stylesheet" href="/ui.css"><main><h1>LUMA · 개발 Controller</h1><p>자동 Merge OFF · ChatGPT 웹 자동 수집 BLOCKED_POLICY · 구독 CLI / 사용자 전달</p><nav><label>PR <input id="pr" type="number" min="1" placeholder="전체 감시"></label><label><input type="checkbox" id="automatic">등록 PR 자동 진행</label><button data-action="start">실행</button><button data-action="pause">일시 정지</button><button data-action="resume">재개</button><button data-action="stop">중지</button><button data-action="refresh">새로 조회</button></nav><section id="status"></section><nav><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT 직접 로그인</a><button data-action="analyze">Codex 구독 분석</button><button data-action="repair">기존 PR 수정</button><button data-action="validate">격리 Release Gate</button><button data-action="gate">Merge Gate 확인</button><button data-action="next">다음 작업 후보</button></nav><p>ChatGPT 탭은 직접 조작합니다. 로그인 상태·쿠키·응답을 자동 읽지 않습니다. 소유권/예산/격리 조건 미충족 시 수정과 게시를 차단합니다.</p><details><summary>PR 목록</summary><pre id="prs"></pre></details><h2>사용자 Merge 승인</h2><input id="merge-head" placeholder="승인할 정확한 HEAD"><label><input id="approval" type="checkbox">Production/정책 승인</label><button data-action="merge">Gate 통과한 HEAD 병합 승인</button><h2>분석 프롬프트</h2><textarea id="prompt" readonly></textarea><h2>수동 AI 결과 JSON</h2><textarea id="response" placeholder='{"status":"HUMAN_REVIEW_REQUIRED","head":"정확한 SHA","reason":"검토 근거","files":[],"tests":[]}'></textarea><button data-action="manual">검증하여 결과 반영</button><h2>수정 프롬프트</h2><pre id="repair"></pre><h2>실행 로그</h2><pre id="logs" aria-live="polite"></pre></main><script src="/ui.js"></script></html>
