name: LUMA PR watch (15 min)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: luma-pr-watch
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Capture PR heads and compare with previous snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr-watch
          gh api --paginate "repos/$GH_REPO/pulls?state=all&per_page=100" \
            --jq '.[] | {number, state, draft, head_sha: .head.sha, base: .base.ref, updated_at, url: .html_url}' \
            | jq -s 'sort_by(.number)' > pr-watch/current.json
          previous=""
          while IFS= read -r run_id; do
            if gh run download "$run_id" -n luma-pr-snapshot -D pr-watch/previous-download >/dev/null 2>&1; then
              previous="pr-watch/previous-download/current.json"
              break
            fi
          done < <(gh run list --workflow "luma-pr-watch-15min.yml" --status success --limit 10 --json databaseId --jq '.[].databaseId')
          if [[ -n "$previous" && -f "$previous" ]]; then
            jq -n --slurpfile current pr-watch/current.json --slurpfile previous "$previous" '
              ($previous[0] | map({key:(.number|tostring),value:.}) | from_entries) as $old |
              [$current[0][] | . as $pr | ($old[($pr.number|tostring)] // null) as $prior |
               select($prior == null or $prior.head_sha != $pr.head_sha or $prior.state != $pr.state or $prior.draft != $pr.draft) |
               {number,head_sha,state,draft,url,change:(if $prior == null then "new" else "updated" end)}]
            ' > pr-watch/changes.json
          else
            echo '[]' > pr-watch/changes.json
            echo "No previous snapshot available; establishing baseline." >> "$GITHUB_STEP_SUMMARY"
          fi
          count=$(jq 'length' pr-watch/changes.json)
          echo "### LUMA PR watch" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed PRs since previous successful snapshot: $count" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- PR #\(.number) (\(.change)): \(.head_sha) — \(.url)"' pr-watch/changes.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save snapshot and changes
        uses: actions/upload-artifact@v4
        with:
          name: luma-pr-snapshot
          path: pr-watch/current.json
          retention-days: 14
      - name: Save change report
        uses: actions/upload-artifact@v4
        with:
          name: luma-pr-changes
          path: pr-watch/changes.json
          retention-days: 14
