name: LUMA PR watch (15 min)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First deployment only: initialize checkpoint after checking no prior pipeline state exists'
        type: boolean
        default: false
  pull_request_target:
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [LUMA PR Validation]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: luma-pr-watch
  cancel-in-progress: false

jobs:
  snapshot:
    # Only trusted default-branch workflow/controller; never execute PR code with this token.
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == github.event.repository.default_branch) &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Restore checkpoint and generate review prompts (execution disabled)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          restore_args=(--require-existing)
          if [[ "$BOOTSTRAP" == "true" ]]; then restore_args=(); fi
          previous=$(python3 scripts/ci/pr_pipeline_restore.py --repo "$GH_REPO" --destination previous-pipeline "${restore_args[@]}")
          args=()
          if [[ -n "$previous" ]]; then args+=(--previous "$previous"); fi
          python3 scripts/ci/pr_pipeline.py --repo "$GH_REPO" --output pr-watch "${args[@]}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('pr-watch/result.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"LUMA PR watch: {r['observed']} PRs, {r['changes']} changes, {len(r['generated'])} prompts. Codex execution OFF; automatic merge OFF.\n")
          PY
      - name: Save atomic checkpoint, changes, source evidence and Korean prompts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luma-pr-pipeline
          path: pr-watch/
          retention-days: 90
          if-no-files-found: error
