name: LUMA PR Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: luma-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  AUTO_REVIEW_MAX_ITERATIONS: '3'
jobs:
  desktop-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:animation
      - run: npm run test:presentation
      - run: npm run test:assets
      - run: npm run validate:assets -- --allow-missing
      - run: python3 -m unittest discover -s tests/automation -v
      - run: python3 scripts/check_tao_patch.py
      - run: git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
  macos-native:
    needs: desktop-static
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-dist
          path: dist/
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: App formatting (do not rewrite vendor)
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -p luma-spike -- --check
      - name: Deterministic regression and native link
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - name: App clippy (upstream vendor warnings remain visible)
        run: cargo +stable clippy --locked --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings
      - name: Compile native focus observer harness
        run: clang -fobjc-arc -framework AppKit scripts/launch_audit.m -o /tmp/luma-launch-audit
      - name: Compile QA-only environment observer and native recorder
        run: |
          clang -fobjc-arc -framework AppKit -framework ApplicationServices scripts/gui_qa/environment_probe.m -o /tmp/luma-environment-probe
          clang -fobjc-arc -framework AppKit -framework ApplicationServices scripts/gui_qa/native.m -o /tmp/luma-native-qa
          clang -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework ApplicationServices scripts/gui_qa/input_receiver.m -o /tmp/luma-input-receiver
          swiftc -parse-as-library scripts/gui_qa/record_window.swift -o /tmp/luma-record-window
      - name: Runtime boundary
        run: echo 'PLATFORM_REQUIRED native compile passed; real desktop launch/mouse/typing is MANUAL_REQUIRED, NOT_RUN on hosted CI.'
      - name: Check out exact PR HEAD for Release Gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare exact-HEAD Release Gate
        working-directory: release-source
        run: |
          brew install postgresql@16
          echo "PG_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 21)" >> "$GITHUB_ENV"
          npm ci
      - name: Run full macOS Release Gate
        working-directory: release-source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 scripts/validate_alpha_release.py --output "$RUNNER_TEMP/luma-release-gate"
      - name: Preserve Release Gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luma-macos-release-gate
          path: ${{ runner.temp }}/luma-release-gate/
          retention-days: 14
          if-no-files-found: warn
  server-java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolated PostgreSQL with ephemeral password
        run: |
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "LUMA_TEST_DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            if docker pull postgres:17-alpine; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
          docker run --pull=never -d --name luma-ci-db -e POSTGRES_USER=luma -e POSTGRES_DB=luma_game_test -e POSTGRES_PASSWORD="$db_password" -p 127.0.0.1:55439:5432 postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec luma-ci-db pg_isready -U luma -d luma_game_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Java 21 tests and bootJar
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          "$JAVA_HOME/bin/java" -version
          ./server/gradlew -p server test bootJar --no-daemon
      - name: Stop isolated test database
        if: always()
        run: docker rm -f luma-ci-db
  review-result:
    if: always()
    needs: [desktop-static, macos-native, server-java]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Produce read-only review contract
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/review_result.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: luma-review-result
          path: review-result.json
          if-no-files-found: error
          retention-days: 14
