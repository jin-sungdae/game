plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}
group = 'dev.luma'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    // Close evicted Spring contexts before their JDBC pools exhaust the test database.
    systemProperty 'spring.test.context.cache.maxSize', '4'
}
// Explicit local validation only. Fixture RNG is test code and absent from bootJar.
tasks.register('liveValidation', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.luma.game.LiveValidationServer'
}

// One versioned Dex definition is shared with the server, not copied manually.
tasks.named('processResources') {
    from('../src/entities/monster-dex.json') { into 'content' }
}
