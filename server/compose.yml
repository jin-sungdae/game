name: luma-local-game
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luma_game
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: ${LUMA_DB_PASSWORD:?Set LUMA_DB_PASSWORD locally}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - luma-game-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma_game"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  luma-game-data:
