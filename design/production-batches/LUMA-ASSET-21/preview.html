<!doctype html><html lang="ko"><meta charset="utf-8"><title>LUMA-ASSET-21 후보 검수</title>
<style>body{font:16px system-ui;background:#202430;color:#eee;padding:24px}section{display:inline-block;margin:15px}img{width:256px;height:256px;background:repeating-conic-gradient(#394051 0% 25%,#454d60 0% 50%) 0/24px 24px}button{padding:10px}small{display:block}</style>
<h1>LUMA-ASSET-21 — 후보 5개</h1><p>Production 미승인 / Runtime 미연결 / DEFERRED_GUI. 원본과 후보를 비교하세요. 재생은 검수용 반복이며 실제 Clip은 단발입니다.</p>
<button id="play">재생 / 정지</button><label> 프레임 <input id="frame" type="range" min="0" max="7" value="0"></label><output id="count">0</output><main></main>
<script>
const cases=[['M087','cursor_react','CURSOR_REACT: 고리 가시 반응'],['M088','hit','HIT: 촉수 반동'],['M089','interact','INTERACT: 주변 촉수 순차 반응'],['M090','cursor_react','CURSOR_REACT: 비대칭 귀 반응'],['M090','interact','INTERACT: 접지 상태 날개 반응']];
for(const [id,action,label] of cases){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=id+' '+label;section.append(heading);const base=document.createElement('img');base.src='../monsters/batch09/'+id+'/base-v2.png';base.alt=id+' 원본';const candidate=document.createElement('img');candidate.dataset.path=id+'/'+action+'/rigged/'+action+'/'+action+'_';candidate.alt=id+' 후보';section.append(base,candidate);document.querySelector('main').append(section);}
let playing=false,index=0;const slider=document.querySelector('#frame');function render(){for(const img of document.querySelectorAll('[data-path]'))img.src=img.dataset.path+String(index).padStart(2,'0')+'.png';slider.value=index;document.querySelector('#count').value=index;}slider.oninput=()=>{playing=false;index=Number(slider.value);render();};document.querySelector('#play').onclick=()=>playing=!playing;setInterval(()=>{if(playing){index=(index+1)%8;render();}},150);render();
</script></html>
